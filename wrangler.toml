name = "us-tw-crypto-analytics-2"
compatibility_date = "2025-12-06"
compatibility_flags = [ "nodejs_compat" ]
main = "app/worker.ts"
assets = { directory = "./build/client" }

[observability]
enabled = true

[vars]
# 機密變數已移至 .dev.vars，正式上線請透過 wrangler secret put 設定
# GEMINI_API_KEY = ""
# TWELVE_DATA_API_KEY = ""
# MASTER_ENCRYPTION_KEY = ""
# INVITATION_CODE = ""

[[d1_databases]]
binding = "DB"
database_name = "crypto-analytics-db"
database_id = "6bf9d8c7-359d-405a-b243-5669a98c614d"
migrations_dir = "drizzle"

[triggers]
crons = ["*/15 * * * *"]
