name = "us-tw-crypto-analytics-2"
compatibility_date = "2025-12-06"
compatibility_flags = [ "nodejs_compat" ]
main = "app/worker.ts"
assets = { directory = "./build/client" }

[observability]
enabled = true

[vars]
# 本機 Wrangler 與 Cloudflare Worker 統一使用此 Gemini 模型；只存模型名稱，不含金鑰。
AI_MODEL = "gemini-3.1-flash-lite"
GEMINI_REVIEW_MODEL = "gemini-3.1-flash-lite"
# 股票訊號由系統以公開行情自行計算，停用外部 TradingView 入口，不需訂閱或警報。
TRADINGVIEW_WEBHOOK_ENABLED = "false"
# 停用所有虛擬幣觀察訊號推播，包含舊佇列與 TradingView；成交及持倉停損通知獨立保留。
CRYPTO_SIGNAL_NOTIFICATIONS_ENABLED = "false"
# 不再自動抓虛擬幣雷達或建立新倉；既有現貨與永續持倉保護仍可平倉。
CRYPTO_AUTO_SCAN_ENABLED = "false"
CRYPTO_NEW_ENTRIES_ENABLED = "false"
# 獨立 Demo 自動化：Bitget 目前拒絕 Cloudflare 出口，待可用執行器完成連線檢查後才開放。
CRYPTO_FUTURES_DEMO_AUTOMATION_ENABLED = "false"
CRYPTO_FUTURES_DEMO_AUTOMATION_PAUSE_REASON = "Bitget 拒絕 Cloudflare 請求（403）；待可正常連線的 Demo 執行器就緒後啟用。升級 Workers 不能解除此限制。"
# 正式合約自動化需要可連線執行器與本人 LIVE 授權；部署此程式不會開啟真實下單。
CRYPTO_FUTURES_LIVE_AUTOMATION_ENABLED = "false"
CRYPTO_FUTURES_LIVE_AUTOMATION_PAUSE_REASON = "此執行器尚未開放 LIVE 自動化；請先完成正式合約連線檢查與本人授權。Cloudflare 對 Bitget 403 仍待排除。"
# 虛擬幣雷達停止自動更新；保留歷史與手動分析功能。
WAVE_RADAR_ENABLED = "false"
# 潛力幣停止排程掃描與通知。
POTENTIAL_RADAR_ENABLED = "false"
# 永續吃大魚停止排程掃描；既有持倉停損使用獨立保護工作。
BINANCE_PERP_RADAR_ENABLED = "false"
# 美股只在收盤附近檢查；同時涵蓋紐約夏令與冬令時間。
US_STOCK_RADAR_ENABLED = "true"
# 台股只在台北 13:08／13:23／13:38／13:53 檢查。
TW_STOCK_RADAR_ENABLED = "true"
# 機密變數已移至 .dev.vars，正式上線請透過 wrangler secret put 設定
# GEMINI_API_KEY = ""
# MASTER_ENCRYPTION_KEY = ""
# INVITATION_CODE = ""
# TradingView Webhook 密鑰：wrangler secret put TRADINGVIEW_WEBHOOK_SECRET
# （正式環境務必用不同於本機 .dev.vars 的隨機值，外洩即等同任何人都能推送假訊號）
# TRADINGVIEW_WEBHOOK_SECRET = ""
# Bitget Demo API 金鑰由登入使用者在設定頁加密保存；不放入 Worker vars，也不與正式盤金鑰共用。
# 美股獨立 Slack 頻道：沿用 SLACK_API_TOKEN，僅需另設 wrangler secret put US_STOCK_SLACK_CHANNEL_ID
# 台股即時進場價格頻道：沿用 SLACK_API_TOKEN，另設 wrangler secret put TW_STOCK_SLACK_CHANNEL_ID
# 虛擬幣即時進場價格頻道：沿用 SLACK_API_TOKEN，另設 wrangler secret put CRYPTO_ENTRY_SLACK_CHANNEL_ID
# Bitget Demo 永續開多／平多專用頻道：另設 wrangler secret put CRYPTO_FUTURES_TRADE_SLACK_CHANNEL_ID

[[d1_databases]]
binding = "DB"
database_name = "crypto-analytics-db"
database_id = "6bf9d8c7-359d-405a-b243-5669a98c614d"
migrations_dir = "drizzle"

[triggers]
# 五個 Trigger 定義；一分鐘檢查已授權的 Demo 策略，既有持倉保護／對帳仍每五分鐘執行。
crons = [
  "8,23,38,53 5 * * 1-5",
  "7,22,37,52 17,18,20,21 * * 1-5",
  "* * * * *",
  "0,15 6 * * 1-5",
  "30,45 20,21 * * 1-5"
]
